version: 3
images:
  base_image:
    name: registry.access.redhat.com/ubi10/ubi:latest
dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  python:
  - pywinrm
  - aiobotocore>=3.9.0 # Set a higher minimum to avoid excessive backtracking for aws packages
  - boto3>=1.43.56 # Set a higher minimum to avoid excessive backtracking for aws packages
  system:
  - git-core # For ansible-galaxy installing from git repositories
  - python3-devel [compile] # For compiling ovirt-engine-sdk-python
  galaxy:
    roles:
    - manageiq.manageiq_automate
    - manageiq.manageiq_vmdb
    collections:
    - amazon.aws
    - ansible.netcommon
    - ansible.utils
    - awx.awx
    - azure.azcollection
    - cisco.intersight
    - community.aws
    - community.okd
    - community.vmware
    - google.cloud
    - kubernetes.core
    - openstack.cloud
    - ovirt.ovirt
    - theforeman.foreman
  exclude:
    system:
    - qemu-img # from collection ovirt.ovirt - not available in ubi10
additional_build_files:
- src: ansible.cfg
  dest: configs
additional_build_steps:
  append_final:
  - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg
  # Use /runner as HOME, matching the ansible-runner/AWX EE convention. The entrypoint
  # script also defaults to /runner for arbitrary UIDs, so this stays consistent across
  # UID 1000 (docker/podman) and random UIDs (Kubernetes/OpenShift).
  - ENV HOME=/runner
  # Set Ansible tmp dirs to fixed paths outside /runner so they are never shadowed by a
  # volume mount on /runner (e.g. when the caller mounts a full private data directory).
  - RUN mkdir -p /var/ansible/local_tmp /var/ansible/remote_tmp && chgrp -R 0 /var/ansible && chmod -R ug+rwx /var/ansible
  - ENV ANSIBLE_LOCAL_TEMP=/var/ansible/local_tmp
  - ENV ANSIBLE_REMOTE_TEMP=/var/ansible/remote_tmp
  # Force color output by default; callers can override with ANSIBLE_FORCE_COLOR=0
  - ENV ANSIBLE_FORCE_COLOR=1
  # Remove __pycache__
  - RUN find / -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true
  # Remove unnecessary large files
  - RUN rm -f /usr/share/ansible/collections/ansible_collections/cisco/intersight/misc/*
  - RUN rm -f /usr/local/lib/python3.12/site-packages/msgraph/generated/kiota-dom-export.txt # https://github.com/microsoftgraph/msgraph-sdk-python/issues/1287
